<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PanganWatch Jember</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--surface:#fff;--border:#e2e8f0;--text:#1a202c;--muted:#718096;--accent:#2563eb;--accent-light:#eff6ff;--red:#dc2626;--red-bg:#fef2f2}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,rgba(37,99,235,.04) 0%,transparent 60%);pointer-events:none}

.brand{display:flex;align-items:center;gap:.6rem;margin-bottom:2rem}
.brand-icon{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:700}
.brand-name{font-size:1.1rem;font-weight:700;color:var(--text)}
.brand-sub{font-size:.72rem;color:var(--muted);margin-top:.05rem}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:2.25rem 2rem;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.card-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:.3rem}
.card-sub{font-size:.82rem;color:var(--muted);margin-bottom:1.75rem}

.tabs{display:flex;background:#f8fafc;border-radius:8px;padding:3px;gap:3px;margin-bottom:1.5rem;border:1px solid var(--border)}
.tab{flex:1;padding:.5rem;text-align:center;border-radius:6px;font-size:.83rem;font-weight:500;cursor:pointer;color:var(--muted);transition:all .15s;border:none;background:transparent;font-family:'Inter',sans-serif}
.tab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.field label{font-size:.78rem;font-weight:600;color:var(--text)}
.input-wrap{position:relative}
.field input{width:100%;background:#fff;border:1px solid var(--border);color:var(--text);padding:.7rem .9rem;border-radius:8px;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.field input.error{border-color:var(--red)}
.pw-toggle{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;padding:.2rem;line-height:1}
.pw-toggle:hover{color:var(--text)}

.err-box{background:var(--red-bg);border:1px solid #fecaca;border-radius:8px;padding:.6rem .85rem;font-size:.82rem;color:var(--red);margin-bottom:1rem;display:none;align-items:center;gap:.5rem}
.err-box.show{display:flex}

.btn-submit{width:100%;margin-top:.25rem;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.85rem;font-family:'Inter',sans-serif;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.btn-submit:hover{background:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.btn-submit:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--muted);font-size:.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.back-link{text-align:center;margin-top:1.25rem;font-size:.8rem;color:var(--muted)}
.back-link a{color:var(--accent);text-decoration:none;font-weight:500}.back-link a:hover{text-decoration:underline}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

footer{margin-top:2rem;font-size:.75rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="brand">
  <div class="brand-icon">PW</div>
  <div>
    <div class="brand-name">PanganWatch</div>
    <div class="brand-sub">Kabupaten Jember</div>
  </div>
</div>

<div class="card">
  <div class="card-title" id="card-title">Selamat Datang</div>
  <div class="card-sub" id="card-sub">Masuk untuk melanjutkan ke dashboard</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Masuk</button>
    <button class="tab" onclick="switchTab('register')">Daftar</button>
  </div>

  <div class="err-box" id="err-box">
    <span>⚠</span><span id="err-msg"></span>
  </div>

  <!-- LOGIN -->
  <div id="form-login">
    <div class="field">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="nama@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="l-password" placeholder="Masukkan password" autocomplete="current-password">
        <button class="pw-toggle" onclick="togglePw('l-password',this)" tabindex="-1">👁</button>
      </div>
    </div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">Masuk</button>
  </div>

  <!-- REGISTER -->
  <div id="form-register" style="display:none">
    <div class="field">
      <label>Nama Lengkap</label>
      <input type="text" id="r-nama" placeholder="Nama Anda" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="r-email" placeholder="nama@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="r-password" placeholder="Minimal 6 karakter" autocomplete="new-password">
        <button class="pw-toggle" onclick="togglePw('r-password',this)" tabindex="-1">👁</button>
      </div>
    </div>
    <button class="btn-submit" id="btn-register" onclick="doRegister()">Buat Akun</button>
  </div>

  <div class="back-link"><a href="/">← Kembali ke Beranda</a></div>
</div>

<footer>© 2025 PanganWatch Jember · Data: SISKAPERBAPO Jawa Timur</footer>

<script>
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='register')));
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('card-title').textContent = t==='login' ? 'Selamat Datang' : 'Buat Akun Baru';
  document.getElementById('card-sub').textContent   = t==='login' ? 'Masuk untuk melanjutkan ke dashboard' : 'Daftar untuk menggunakan PanganWatch';
  hideErr();
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

function showErr(msg) {
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err-box').classList.add('show');
}
function hideErr() {
  document.getElementById('err-box').classList.remove('show');
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span> Memproses...' : label;
}

async function doLogin() {
  hideErr();
  const email    = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-password').value;
  if (!email || !password) return showErr('Email dan password wajib diisi');

  setLoading('btn-login', true, 'Masuk');
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if (!r.ok) return showErr(d.error || 'Login gagal');
    window.location.href = d.role === 'admin' ? '/admin' : '/user';
  } catch(e) {
    showErr('Terjadi kesalahan, coba lagi');
  } finally {
    setLoading('btn-login', false, 'Masuk');
  }
}

async function doRegister() {
  hideErr();
  const nama     = document.getElementById('r-nama').value.trim();
  const email    = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-password').value;
  if (!email || !password) return showErr('Email dan password wajib diisi');
  if (password.length < 6)  return showErr('Password minimal 6 karakter');

  setLoading('btn-register', true, 'Buat Akun');
  try {
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password, nama})
    });
    const d = await r.json();
    if (!r.ok) return showErr(d.error || 'Registrasi gagal');
    window.location.href = '/user';
  } catch(e) {
    showErr('Terjadi kesalahan, coba lagi');
  } finally {
    setLoading('btn-register', false, 'Buat Akun');
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('form-login').style.display !== 'none';
  loginVisible ? doLogin() : doRegister();
});
</script>
</body>
</html>
