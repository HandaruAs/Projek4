<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PanganWatch Jember</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#21262d;--text:#e6edf3;--muted:#8b949e;--accent:#f0a500;--green:#3fb950;--red:#f85149;--blue:#58a6ff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 60% 30%,rgba(240,165,0,.07),transparent);pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem 2.5rem;width:100%;max-width:420px;position:relative;z-index:1}
.logo{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--accent);text-align:center;margin-bottom:.25rem}
.logo span{color:var(--text)}
.subtitle{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:2.5rem}
.tabs{display:flex;background:var(--surface2);border-radius:10px;padding:4px;gap:4px;margin-bottom:2rem}
.tab{flex:1;padding:.6rem;text-align:center;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'DM Sans',sans-serif}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.field label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.75rem 1rem;border-radius:10px;font-size:.95rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;width:100%}
.field input:focus{border-color:var(--accent)}
.btn-submit{width:100%;margin-top:.5rem;background:var(--accent);color:#000;border:none;border-radius:10px;padding:1rem;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-submit:hover{background:#d4920a;transform:translateY(-1px)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--red);border-radius:8px;padding:.6rem .9rem;font-size:.84rem;margin-bottom:1rem;display:none}
.back-link{text-align:center;margin-top:1.5rem;font-size:.83rem;color:var(--muted)}
.back-link a{color:var(--accent);text-decoration:none}
.spinner{width:18px;height:18px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Pangan<span>Watch</span></div>
  <div class="subtitle">Kabupaten Jember · Sistem Prediksi Harga</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Masuk</button>
    <button class="tab" onclick="switchTab('register')">Daftar</button>
  </div>

  <div id="err" class="err"></div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <div class="field">
      <label>Username</label>
      <input type="text" id="l-username" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="l-password" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">Masuk</button>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register" style="display:none">
    <div class="field">
      <label>Nama Lengkap</label>
      <input type="text" id="r-nama" placeholder="Nama Anda">
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="r-username" placeholder="Pilih username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="r-password" placeholder="Min. 6 karakter" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="btn-register" onclick="doRegister()">Buat Akun</button>
  </div>

  <div class="back-link"><a href="/">← Kembali ke Beranda</a></div>
</div>

<script>
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (i===0&&t==='login')||(i===1&&t==='register')));
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('err').style.display = 'none';
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = '';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span> Memproses...' : (btnId==='btn-login' ? 'Masuk' : 'Buat Akun');
}

async function doLogin() {
  const u = document.getElementById('l-username').value.trim();
  const p = document.getElementById('l-password').value;
  if (!u || !p) return showErr('Isi username dan password terlebih dahulu');
  setLoading('btn-login', true);
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.error); return; }
    window.location.href = d.role === 'admin' ? '/admin' : '/user';
  } catch(e) { showErr('Terjadi kesalahan, coba lagi'); }
  finally { setLoading('btn-login', false); }
}

async function doRegister() {
  const nama = document.getElementById('r-nama').value.trim();
  const u    = document.getElementById('r-username').value.trim();
  const p    = document.getElementById('r-password').value;
  if (!u || !p) return showErr('Username dan password wajib diisi');
  if (p.length < 6) return showErr('Password minimal 6 karakter');
  setLoading('btn-register', true);
  try {
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p, nama})
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.error); return; }
    window.location.href = '/user';
  } catch(e) { showErr('Terjadi kesalahan, coba lagi'); }
  finally { setLoading('btn-register', false); }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('form-login').style.display !== 'none') doLogin();
  else doRegister();
});
</script>
</body>
</html>
