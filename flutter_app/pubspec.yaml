name: flutter_app
description: Aplikasi Monitoring dan Prediksi Harga Pangan
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Environment Variables
  flutter_dotenv: ^5.1.0
  # Markdown Rendering
  flutter_markdown: ^0.7.3
  # Router
  go_router: ^14.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Networking
  dio: ^5.4.0
  http: ^1.6.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Charts
  fl_chart: ^0.69.0

  # Date & Time
  intl: ^0.18.1

  # Image
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7         

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/LOGO-2.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/\
    - .env